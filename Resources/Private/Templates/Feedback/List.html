<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <h1>Feedback</h1>

    <!-- Filters -->
    <div class="form-inline mb-3">
        <f:form action="list" method="get" class="form-inline">
            <div class="form-group me-2">
                <label class="me-1">Status:</label>
                <f:form.select property="status" options="{statusOptions}" optionValueField="" optionLabelField=""
                               prependOptionLabel="All" prependOptionValue="" value="{currentStatus}"
                               class="form-select form-select-sm" />
            </div>
            <div class="form-group me-2">
                <label class="me-1">Priority:</label>
                <f:form.select property="priority" options="{priorityOptions}" optionValueField="" optionLabelField=""
                               prependOptionLabel="All" prependOptionValue="" value="{currentPriority}"
                               class="form-select form-select-sm" />
            </div>
            <f:form.submit value="Filter" class="btn btn-sm btn-default" />
        </f:form>
    </div>

    <f:if condition="{feedbacks}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th style="width: 90px">Status</th>
                        <th>Title</th>
                        <th>Page</th>
                        <th>Priority</th>
                        <th>Reporter</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{feedbacks}" as="feedback">
                        <tr>
                            <td>
                                <f:switch expression="{feedback.status}">
                                    <f:case value="open"><span class="badge" style="background:#3b82f6;color:#fff">Open</span></f:case>
                                    <f:case value="in_progress"><span class="badge" style="background:#f59e0b;color:#1c1917">In Progress</span></f:case>
                                    <f:case value="resolved"><span class="badge" style="background:#22c55e;color:#fff">Resolved</span></f:case>
                                    <f:case value="closed"><span class="badge" style="background:#6b7280;color:#fff">Closed</span></f:case>
                                </f:switch>
                            </td>
                            <td>
                                <f:link.action action="show" arguments="{feedback: feedback.uid}">
                                    {feedback.title}
                                </f:link.action>
                            </td>
                            <td>
                                <f:if condition="{feedback.pageUid}">
                                    #{feedback.pageUid}
                                </f:if>
                            </td>
                            <td>
                                <f:switch expression="{feedback.priority}">
                                    <f:case value="low"><span class="badge" style="background:#e0f2fe;color:#0c4a6e">Low</span></f:case>
                                    <f:case value="medium"><span class="badge" style="background:#fef3c7;color:#92400e">Medium</span></f:case>
                                    <f:case value="high"><span class="badge" style="background:#fee2e2;color:#991b1b">High</span></f:case>
                                </f:switch>
                            </td>
                            <td>{feedback.backendUsername}</td>
                            <td><f:format.date format="d.m.Y H:i">{feedback.crdate}</f:format.date></td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="media">
                    <div class="media-body">
                        <p>No feedback submissions yet. Feedback will appear here once submitted via the T3Pinpoint widget on the frontend.</p>
                    </div>
                </div>
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
