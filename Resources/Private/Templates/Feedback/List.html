<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

    <div class="t3pin-list">

        <h1 class="t3pin-list-title">Feedback</h1>

        <!-- Filters -->
        <div class="t3pin-filter-bar">
            <f:form action="list" method="get" class="d-flex align-items-center gap-3 flex-wrap">
                <div class="t3pin-filter-group">
                    <label class="t3pin-filter-label">Status</label>
                    <f:form.select property="status" options="{statusOptions}" optionValueField="" optionLabelField=""
                                   prependOptionLabel="All" prependOptionValue="" value="{currentStatus}"
                                   class="form-select form-select-sm" />
                </div>
                <div class="t3pin-filter-group">
                    <label class="t3pin-filter-label">Priority</label>
                    <f:form.select property="priority" options="{priorityOptions}" optionValueField="" optionLabelField=""
                                   prependOptionLabel="All" prependOptionValue="" value="{currentPriority}"
                                   class="form-select form-select-sm" />
                </div>
                <f:form.submit value="Filter" class="btn btn-sm btn-default" />
            </f:form>
        </div>

        <f:if condition="{feedbacks}">
            <f:then>
                <div class="t3pin-table-wrap">
                    <table class="t3pin-table">
                        <thead>
                            <tr>
                                <th style="width: 100px">Status</th>
                                <th>Title</th>
                                <th style="width: 70px">Page</th>
                                <th style="width: 90px">Priority</th>
                                <th>Reporter</th>
                                <th style="width: 130px">Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{feedbacks}" as="feedback">
                                <tr>
                                    <td>
                                        <f:switch expression="{feedback.status}">
                                            <f:case value="open"><span class="t3pin-badge t3pin-badge-open">Open</span></f:case>
                                            <f:case value="in_progress"><span class="t3pin-badge t3pin-badge-in-progress">In Progress</span></f:case>
                                            <f:case value="resolved"><span class="t3pin-badge t3pin-badge-resolved">Resolved</span></f:case>
                                            <f:case value="closed"><span class="t3pin-badge t3pin-badge-closed">Closed</span></f:case>
                                        </f:switch>
                                    </td>
                                    <td>
                                        <f:link.action action="show" arguments="{feedback: feedback.uid}" class="t3pin-table-link">
                                            {feedback.title}
                                        </f:link.action>
                                    </td>
                                    <td>
                                        <f:if condition="{feedback.pageUid}">
                                            #{feedback.pageUid}
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:switch expression="{feedback.priority}">
                                            <f:case value="low"><span class="t3pin-badge t3pin-badge-low">Low</span></f:case>
                                            <f:case value="medium"><span class="t3pin-badge t3pin-badge-medium">Medium</span></f:case>
                                            <f:case value="high"><span class="t3pin-badge t3pin-badge-high">High</span></f:case>
                                        </f:switch>
                                    </td>
                                    <td>{feedback.backendUsername}</td>
                                    <td><f:format.date format="d.m.Y H:i">{feedback.crdate}</f:format.date></td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <div class="t3pin-list-empty">
                    <p>No feedback submissions yet.</p>
                    <p>Feedback will appear here once submitted via the T3Pinpoint widget on the frontend.</p>
                </div>
            </f:else>
        </f:if>

    </div>

</f:section>

</html>
