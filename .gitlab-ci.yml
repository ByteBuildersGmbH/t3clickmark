stages:
  - audit
  - deploy

# Block push if any AI tool reference is found in tracked files.
#
# Patterns use word boundaries (\b) for short tool names that
# would otherwise collide with TYPO3 / CSS / minified bundle content.
# Built artefacts and self-references are excluded from the scan.
audit-ai-references:
  stage: audit
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - |
      PATTERNS='\bclaude\b|\banthropic\b|\bopenai\b|\bcopilot\b|\bchatgpt\b'
      PATTERNS="$PATTERNS|\bgpt-[0-9]|\bopenai-o[1-9]\b|\bo[1-9]-(mini|preview|pro)\b"
      PATTERNS="$PATTERNS|\bgemini-(pro|flash|ultra|nano)\b|google bard"
      PATTERNS="$PATTERNS|\bcodex\b|\bcodewhisperer\b|amazon q\b|\btabnine\b"
      PATTERNS="$PATTERNS|\bwindsurf\b|cursor\.(com|so|ai)|cursor (ai|editor|composer|tab)"
      PATTERNS="$PATTERNS|\baider\b|sourcegraph cody|sourcegraph ai"
      PATTERNS="$PATTERNS|\bdevin\b|cognition (ai|labs)|replit ai|\bghostwriter\b"
      PATTERNS="$PATTERNS|phind\.com|\bcodeium\b|\bsupermaven\b"
      PATTERNS="$PATTERNS|mistral (ai|large|medium|small)|\bllama-?[0-9]"
      PATTERNS="$PATTERNS|\bdeepseek\b|\bqwen\b|cohere (ai|api)|perplexity (ai|api)"
      PATTERNS="$PATTERNS|co-authored-by:.*claude|co-authored-by:.*anthropic"
      PATTERNS="$PATTERNS|ai-(generated|assisted|written|coded)|llm-generated"
      PATTERNS="$PATTERNS|generated (by|with|using|via) (ai|claude|gpt|chatgpt|copilot)"
      PATTERNS="$PATTERNS|written (by|with) (an? )?(ai|llm|bot|assistant|agent)"
      echo "Scanning tracked files for AI references..."
      if git grep -i -E "$PATTERNS" HEAD -- \
        ':!.gitlab-ci.yml' \
        ':!*.min.js' \
        ':!*.min.css' \
        ':!Resources/Public/JavaScript/*.js' \
        ':!Resources/Public/Css/*.css' \
        ':!composer.lock' \
        ':!package-lock.json'; then
        echo ""
        echo "BLOCKED: AI/tool reference found in tracked files."
        echo "Fix before pushing to public repo."
        exit 1
      fi
      echo "OK: No AI references found."

# Mirror to GitHub on tag push (only after audit passes)
mirror-to-github:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - audit-ai-references
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Diagnose what GitLab actually wrote into the variable file
    - echo "Var size = $(wc -c < $GITHUB_DEPLOY_KEY) bytes"
    - echo "Var lines = $(wc -l < $GITHUB_DEPLOY_KEY)"
    - echo "First 4 bytes (hex) = $(head -c 4 $GITHUB_DEPLOY_KEY | xxd -p)"
    - echo "Last 4 bytes (hex) = $(tail -c 4 $GITHUB_DEPLOY_KEY | xxd -p)"
    # Auto-fix: strip UTF-8 BOM + CR (Windows line endings); guarantee trailing newline
    - sed '1s/^\xEF\xBB\xBF//' "$GITHUB_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - 'tail -c1 ~/.ssh/id_ed25519 | xxd -p | grep -qE "^0a$" || printf "\n" >> ~/.ssh/id_ed25519'
    - chmod 600 ~/.ssh/id_ed25519
    # Validate before use — bail with useful message on failure
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/derived.pub && echo "Key OK; derived pub fingerprint = $(ssh-keygen -lf /tmp/derived.pub)" || (echo "ERROR Key still malformed after autofix"; exit 1)
    - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
  script:
    # Ensure full history + all tags are available (shallow clones break push to empty repo)
    - git fetch --unshallow origin 2>/dev/null || true
    - git fetch origin --tags
    - git remote add github git@github.com:ByteBuildersGmbH/t3clickmark.git || true
    - git push github HEAD:refs/heads/main --tags
